
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زهرة Zohra - المكتبة الرقمية الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f1f5f9; }
        .book-card {
            background: white;
            border-radius: 1.25rem;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            border-color: #a5b4fc;
        }
        .book-cover {
            height: 180px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 3rem;
            overflow: hidden;
        }
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-cover .fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
        }
        .price-tag {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .btn-preview { background: #eef2ff; color: #4338ca; transition: 0.2s; }
        .btn-preview:hover { background: #c7d2fe; }
        .btn-download { background: #1e293b; color: white; transition: 0.2s; }
        .btn-download:hover { background: #0f172a; }
        .alpha-filter button {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            font-weight: 700;
            transition: 0.15s;
            cursor: pointer;
        }
        .alpha-filter button:hover { background: #e0e7ff; border-color: #6366f1; }
        .alpha-filter button.active { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        .header-gradient { background: linear-gradient(135deg, #1e1b4b, #312e81, #4f46e5); }
        .search-box { background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .search-box input { background: transparent; border: none; color: white; padding: 0.7rem 1rem; width: 100%; outline: none; }
        .search-box input::placeholder { color: rgba(255,255,255,0.6); }
        .search-box button { background: #fbbf24; color: #1e1b4b; font-weight: 700; padding: 0.5rem 1.5rem; border-radius: 999px; border: none; cursor: pointer; transition: 0.2s; }
        .search-box button:hover { background: #f59e0b; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #6b7280; }
        .empty-state i { font-size: 3rem; color: #d1d5db; margin-bottom: 1rem; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 2rem; height: 2rem; animation: spin 1s linear infinite; margin: 1rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .source-badge { font-size: 0.6rem; background: #e5e7eb; color: #4b5563; padding: 0.1rem 0.5rem; border-radius: 999px; }
        .source-badge.external { background: #dbeafe; color: #1e40af; }
        .source-badge.local { background: #f3e8ff; color: #6d28d9; }
    </style>
</head>
<body>

<!-- الرأس -->
<header class="header-gradient text-white py-5 px-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center gap-3">
            <i class="fas fa-book-open text-3xl text-yellow-300"></i>
            <div>
                <h1 class="text-2xl font-extrabold">زهرة <span class="text-yellow-300">Zohra</span></h1>
                <p class="text-xs text-indigo-200">محرك بحث داخلي + عالمي</p>
            </div>
        </div>
        <div class="search-box flex items-center w-full md:w-auto md:min-w-[300px]">
            <i class="fas fa-search text-indigo-300 mx-2"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن كتاب، مؤلف، أو كلمة">
            <button id="searchBtn"><i class="fas fa-arrow-left ml-1"></i> بحث</button>
        </div>
    </div>
</header>

<!-- المحتوى الرئيسي -->
<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- شريط الحروف -->
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-gray-100">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <span class="text-sm font-bold text-gray-700 flex items-center gap-2">
                <i class="fas fa-sort-alpha-down text-indigo-500"></i> تصفح حسب الحرف:
            </span>
            <div class="alpha-filter" id="alphaFilter"></div>
            <button id="clearAlphaBtn" class="text-sm text-gray-400 hover:text-gray-700 transition">
                <i class="fas fa-times-circle"></i> إلغاء
            </button>
        </div>
    </div>

    <!-- شريط النتائج والترتيب -->
    <div class="flex flex-wrap items-center justify-between mb-4">
        <span id="resultCount" class="text-sm text-gray-500">
            <i class="fas fa-table ml-1"></i> <span id="countNumber">0</span> كتاب
            <span id="externalCount" class="text-xs text-gray-400 mr-2"></span>
        </span>
        <div class="flex items-center gap-2">
            <span class="text-sm text-gray-500">ترتيب:</span>
            <select id="sortOrder" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:ring-2 focus:ring-indigo-200 outline-none">
                <option value="default">الافتراضي</option>
                <option value="title">حسب العنوان</option>
                <option value="author">حسب المؤلف</option>
            </select>
            <button id="searchExternalBtn" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg transition">
                <i class="fas fa-globe"></i> بحث عالمي
            </button>
        </div>
    </div>

    <!-- مؤشر التحميل -->
    <div id="loader" class="hidden text-center my-6">
        <div class="loader"></div>
        <p class="text-sm text-gray-500">جاري جلب النتائج من المكتبات العالمية...</p>
    </div>

    <!-- شبكة الكتب -->
    <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

    <!-- حالة فارغة -->
    <div id="emptyState" class="empty-state hidden">
        <i class="fas fa-book-open"></i>
        <p class="text-lg font-medium">لا توجد كتب تطابق بحثك</p>
        <p class="text-sm text-gray-400">جرب تغيير كلمات البحث أو اختيار حرف آخر</p>
    </div>

</main>

<!-- تذييل -->
<footer class="bg-gray-900 text-gray-400 text-center py-6 mt-8">
    <p class="text-sm">© 2026 <span class="text-white font-semibold">زهرة Zohra</span> — محرك بحث داخلي + Open Library API</p>
</footer>

<script>
    (function() {
        // ==============================
        // 1. قاعدة بيانات الكتب المحلية
        // ==============================
        const localBooks = [
            { id: 1, title: "أرض زيكولا", author: "عمرو عبد الحميد", year: 2020, category: "رواية", price: "1.00 €", snippet: "رواية خيالية علمية تأخذك إلى عالم موازٍ مليء بالألغاز.", cover: "https://picsum.photos/seed/zikola/400/300", source: 'local' },
            { id: 2, title: "مقدمة ابن خلدون", author: "ابن خلدون", year: 1377, category: "فلسفة وتاريخ", price: "1.00 €", snippet: "الكتاب المؤسس لعلم الاجتماع والتاريخ.", cover: "https://picsum.photos/seed/ibnkh/400/300", source: 'local' },
            { id: 3, title: "لأنك الله", author: "علي بن جابر الفيفي", year: 2018, category: "فكر وروحانيات", price: "1.00 €", snippet: "كتاب روحاني يستعرض أسماء الله الحسنى وتأملاتها.", cover: "https://picsum.photos/seed/llah/400/300", source: 'local' },
            { id: 4, title: "البيان والتبيين", author: "الجاحظ", year: 850, category: "أدب وبلاغة", price: "1.00 €", snippet: "موسوعة أدبية وبلاغية من أهم كتب التراث.", cover: "https://picsum.photos/seed/bayan/400/300", source: 'local' },
            { id: 5, title: "الأيام", author: "طه حسين", year: 1929, category: "سيرة ذاتية", price: "1.00 €", snippet: "سيرة عميد الأدب العربي منذ الطفولة حتى النضج.", cover: "https://picsum.photos/seed/ayam/400/300", source: 'local' },
            { id: 6, title: "موسوعة الفلسفة الحديثة", author: "جماعة من الباحثين", year: 2015, category: "فلسفة", price: "1.00 €", snippet: "مرجع شامل يغطي أهم التيارات الفلسفية.", cover: "https://picsum.photos/seed/falsafa/400/300", source: 'local' },
            { id: 7, title: "الذكاء الاصطناعي", author: "د. أحمد المنصور", year: 2023, category: "علوم حاسوب", price: "1.00 €", snippet: "مدخل شامل إلى الذكاء الاصطناعي وتطبيقاته.", cover: "https://picsum.photos/seed/ai/400/300", source: 'local' },
            { id: 8, title: "هندسة البرمجيات", author: "د. سارة الخالدي", year: 2022, category: "هندسة", price: "1.00 €", snippet: "دليل متكامل لمنهجيات تطوير البرمجيات.", cover: "https://picsum.photos/seed/soft/400/300", source: 'local' },
            { id: 9, title: "تاريخ الفلسفة الغربية", author: "د. رامي الحكيم", year: 2021, category: "فلسفة", price: "1.00 €", snippet: "رحلة عبر تطور الفكر الفلسفي من الإغريق.", cover: "https://picsum.photos/seed/phil/400/300", source: 'local' },
            { id: 10, title: "الفيزياء الكمية", author: "د. نادر فوزي", year: 2024, category: "فيزياء", price: "1.00 €", snippet: "شرح مبسط لميكانيكا الكم مع رسوم توضيحية.", cover: "https://picsum.photos/seed/quantum/400/300", source: 'local' },
            { id: 11, title: "تحليل البيانات بـ Python", author: "م. ليلى حسن", year: 2023, category: "علوم حاسوب", price: "1.00 €", snippet: "دليل عملي لتحليل البيانات باستخدام مكتبات Python.", cover: "https://picsum.photos/seed/pyData/400/300", source: 'local' },
            { id: 12, title: "الأدب العباسي", author: "أ. أمل السعدي", year: 2020, category: "أدب", price: "1.00 €", snippet: "دراسة متعمقة للشعر والنثر في العصر العباسي.", cover: "https://picsum.photos/seed/abbasi/400/300", source: 'local' }
        ];

        // ==============================
        // 2. متغيرات الحالة
        // ==============================
        let allBooks = [...localBooks]; // جميع الكتب (محلية + خارجية)
        let externalBooks = []; // الكتب المستوردة من API
        let isSearchingExternal = false;

        const state = {
            query: '',
            alpha: null,
        };

        // ==============================
        // 3. عناصر DOM
        // ==============================
        const grid = document.getElementById('booksGrid');
        const emptyState = document.getElementById('emptyState');
        const countSpan = document.getElementById('countNumber');
        const externalCountSpan = document.getElementById('externalCount');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchExternalBtn = document.getElementById('searchExternalBtn');
        const alphaContainer = document.getElementById('alphaFilter');
        const clearAlphaBtn = document.getElementById('clearAlphaBtn');
        const sortOrder = document.getElementById('sortOrder');
        const loader = document.getElementById('loader');

        // ==============================
        // 4. دوال التصفية والترتيب والعرض
        // ==============================

        // تصفية الكتب (محلية + خارجية)
        function getFilteredBooks(booksList) {
            const q = state.query.trim().toLowerCase();
            const alpha = state.alpha;

            return booksList.filter(book => {
                let matchQuery = true;
                if (q) {
                    const inTitle = (book.title || '').toLowerCase().includes(q);
                    const inAuthor = (book.author || '').toLowerCase().includes(q);
                    const inSnippet = (book.snippet || '').toLowerCase().includes(q);
                    matchQuery = inTitle || inAuthor || inSnippet;
                }
                let matchAlpha = true;
                if (alpha) {
                    const first = (book.title || '').trim()[0] || '';
                    matchAlpha = (first === alpha);
                }
                return matchQuery && matchAlpha;
            });
        }

        // ترتيب النتائج
        function sortBooks(booksList) {
            const order = sortOrder.value;
            const sorted = [...booksList];
            if (order === 'title') {
                sorted.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ar'));
            } else if (order === 'author') {
                sorted.sort((a, b) => (a.author || '').localeCompare(b.author || '', 'ar'));
            }
            return sorted;
        }

        // عرض البطاقات
        function renderBooks(booksList) {
            grid.innerHTML = '';
            if (booksList.length === 0) {
                emptyState.classList.remove('hidden');
                countSpan.textContent = '0';
                externalCountSpan.textContent = '';
                return;
            }
            emptyState.classList.add('hidden');
            const localCount = booksList.filter(b => b.source === 'local').length;
            const externalCount = booksList.filter(b => b.source === 'external').length;
            countSpan.textContent = booksList.length;
            externalCountSpan.textContent = externalCount > 0 ? `(+${externalCount} من الخارج)` : '';

            booksList.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card flex flex-col';

                // الغلاف
                const coverDiv = document.createElement('div');
                coverDiv.className = 'book-cover';
                const img = document.createElement('img');
                img.src = book.cover || 'https://picsum.photos/seed/' + (book.id || Math.random()) + '/400/300';
                img.alt = book.title || 'كتاب';
                img.onerror = function() {
                    this.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.className = 'fallback';
                    fallback.innerHTML = `<i class="fas fa-book"></i><span>${book.title || 'كتاب'}</span>`;
                    coverDiv.appendChild(fallback);
                };
                coverDiv.appendChild(img);

                // المحتوى
                const body = document.createElement('div');
                body.className = 'p-4 flex flex-col flex-grow';

                const titleEl = document.createElement('h3');
                titleEl.className = 'text-base font-bold text-gray-800 line-clamp-2';
                titleEl.textContent = book.title || 'عنوان غير معروف';

                const authorEl = document.createElement('p');
                authorEl.className = 'text-sm text-indigo-600 font-medium mt-1';
                authorEl.textContent = book.author || 'مؤلف مجهول';

                const snippetEl = document.createElement('p');
                snippetEl.className = 'text-xs text-gray-500 mt-2 line-clamp-2 flex-grow';
                snippetEl.textContent = book.snippet || 'لا يوجد مقتطف';

                // مصدر الكتاب (محلي / خارجي)
                const sourceBadge = document.createElement('span');
                sourceBadge.className = `source-badge ${book.source === 'external' ? 'external' : 'local'} text-[0.5rem] px-2 py-0.5 rounded-full`;
                sourceBadge.textContent = book.source === 'external' ? '🌐 عالمي' : '📚 محلي';

                const meta = document.createElement('div');
                meta.className = 'flex items-center justify-between mt-3 pt-2 border-t border-gray-100 flex-wrap gap-1';
                const price = document.createElement('span');
                price.className = 'price-tag';
                price.textContent = book.price || 'مجاني';
                const category = document.createElement('span');
                category.className = 'text-xs text-gray-400';
                category.textContent = book.category || 'عام';
                meta.appendChild(price);
                meta.appendChild(category);
                meta.appendChild(sourceBadge);

                const actions = document.createElement('div');
                actions.className = 'flex gap-2 mt-3';
                const previewBtn = document.createElement('button');
                previewBtn.className = 'flex-1 btn-preview text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1';
                previewBtn.innerHTML = `<i class="fas fa-eye"></i> معاينة`;
                previewBtn.onclick = () => {
                    const info = `📖 معاينة: ${book.title || 'كتاب'}\nالمؤلف: ${book.author || 'مجهول'}\n${book.snippet || ''}`;
                    alert(info);
                };

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'flex-1 btn-download text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1';
                downloadBtn.innerHTML = `<i class="fas fa-file-pdf"></i> تحميل`;
                downloadBtn.onclick = () => {
                    const link = book.infoLink || book.previewLink || 'https://openlibrary.org';
                    if (book.source === 'external') {
                        window.open(link, '_blank');
                    } else {
                        alert(`📥 تحميل: ${book.title}\n(هذا كتاب محلي، يمكنك تحميله من المصدر)`);
                    }
                };

                actions.appendChild(previewBtn);
                actions.appendChild(downloadBtn);

                body.appendChild(titleEl);
                body.appendChild(authorEl);
                body.appendChild(snippetEl);
                body.appendChild(meta);
                body.appendChild(actions);

                card.appendChild(coverDiv);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        // الدالة الرئيسية لتحديث الواجهة (من كل المصادر)
        function applyFilters() {
            const filtered = getFilteredBooks(allBooks);
            const sorted = sortBooks(filtered);
            renderBooks(sorted);
        }

        // ==============================
        // 5. البحث الخارجي (Open Library API)
        // ==============================
        async function searchExternal(query, author = '') {
            if (!query && !author) return;
            loader.classList.remove('hidden');
            isSearchingExternal = true;

            try {
                let q = query;
                if (author) q += `+author:"${encodeURIComponent(author)}"`;
                const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20&fields=title,author_name,publisher,publish_year,first_publish_year,cover_i,key,subject,language&sort=relevance`;

                const response = await fetch(url);
                if (!response.ok) throw new Error('فشل الاتصال');

                const data = await response.json();
                const docs = data.docs || [];

                // تحويل النتائج إلى صيغة متوافقة مع بطاقاتنا
                const newExternal = docs.map((doc, index) => {
                    const coverId = doc.cover_i;
                    let cover = `https://picsum.photos/seed/ext${index + Date.now()}/400/300`;
                    if (coverId) cover = `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;

                    return {
                        id: `ext_${index}_${Date.now()}`,
                        title: doc.title || 'عنوان غير معروف',
                        author: doc.author_name ? doc.author_name.join('، ') : 'مؤلف مجهول',
                        year: doc.first_publish_year || (doc.publish_year ? doc.publish_year[0] : ''),
                        category: doc.subject ? doc.subject[0] : 'عام',
                        price: 'مجاني',
                        snippet: `من Open Library - ${doc.title || ''}`,
                        cover: cover,
                        source: 'external',
                        previewLink: `https://openlibrary.org${doc.key}`,
                        infoLink: `https://openlibrary.org${doc.key}`,
                        language: doc.language ? doc.language[0] : '',
                    };
                });

                // دمج النتائج الجديدة مع الموجودة (تجنب التكرار)
                const existingIds = new Set(allBooks.map(b => b.id));
                const filteredNew = newExternal.filter(b => !existingIds.has(b.id));

                // إضافة إلى القائمة الكلية
                allBooks = [...allBooks, ...filteredNew];
                externalBooks = filteredNew;

                // تحديث الواجهة
                applyFilters();
                loader.classList.add('hidden');
                isSearchingExternal = false;

                if (filteredNew.length === 0) {
                    alert('⚠️ لم يتم العثور على نتائج جديدة من المكتبات العالمية.');
                } else {
                    alert(`✅ تم جلب ${filteredNew.length} كتاب من Open Library.`);
                }

            } catch (error) {
                loader.classList.add('hidden');
                isSearchingExternal = false;
                alert('⚠️ فشل الاتصال بخادم Open Library. تأكد من اتصالك بالإنترنت.');
                console.error('External search error:', error);
            }
        }

        // ==============================
        // 6. إنشاء أزرار الحروف
        // ==============================
        function buildAlphaButtons() {
            const arabicLetters = ['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];
            // استخراج الحروف من جميع الكتب (محلية + خارجية)
            const used = new Set();
            allBooks.forEach(book => {
                const first = (book.title || '').trim()[0] || '';
                if (arabicLetters.includes(first)) used.add(first);
            });
            const sorted = arabicLetters.filter(ch => used.has(ch));

            alphaContainer.innerHTML = '';
            sorted.forEach(ch => {
                const btn = document.createElement('button');
                btn.textContent = ch;
                btn.dataset.letter = ch;
                btn.addEventListener('click', function() {
                    if (state.alpha === ch) {
                        state.alpha = null;
                        this.classList.remove('active');
                    } else {
                        document.querySelectorAll('.alpha-filter button').forEach(b => b.classList.remove('active'));
                        state.alpha = ch;
                        this.classList.add('active');
                    }
                    applyFilters();
                });
                alphaContainer.appendChild(btn);
            });
        }

        // ==============================
        // 7. ربط الأحداث
        // ==============================

        // البحث الداخلي (فوري)
        searchInput.addEventListener('input', function() {
            state.query = this.value;
            applyFilters();
        });

        searchBtn.addEventListener('click', function() {
            state.query = searchInput.value;
            applyFilters();
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                state.query = this.value;
                applyFilters();
            }
        });

        // البحث الخارجي (عند الضغط على الزر)
        searchExternalBtn.addEventListener('click', function() {
            const query = searchInput.value.trim();
            const author = ''; // يمكن استخراج المؤلف من النص إذا أردت
            if (!query) {
                alert('الرجاء إدخال كلمة بحث أولاً.');
                return;
            }
            searchExternal(query, author);
        });

        // إلغاء تصفية الحروف
        clearAlphaBtn.addEventListener('click', function() {
            state.alpha = null;
            document.querySelectorAll('.alpha-filter button').forEach(b => b.classList.remove('active'));
            applyFilters();
        });

        // تغيير الترتيب
        sortOrder.addEventListener('change', applyFilters);

        // ==============================
        // 8. التهيئة والعرض الأولي
        // ==============================
        buildAlphaButtons();
        applyFilters();

        console.log('✅ زهرة Zohra جاهزة! (محلي + خارجي)');
        console.log(`📚 ${localBooks.length} كتاب محلي، يمكن البحث عن المزيد عالمياً.`);

    })();
</script>

</body>
</html>
