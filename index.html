<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك البحث العالمي المتقدم للكتب</title>
    <!-- Tailwind CSS للتصميم العصري والسريع -->
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الرأس وشريط البحث المتقدم (مستوحى من بحث Google المتقدم) -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-lg p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-center mb-6">🔍 المحرك العالمي للبحث عن الكتب والمراجع</h1>
            
            <form id="searchForm" class="space-y-4 bg-white/10 p-4 rounded-xl backdrop-blur-md">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="query" placeholder="اسم الكتاب أو الكلمات المفتاحية..." class="w-full p-3 rounded-lg bg-white text-gray-900 border-none focus:ring-2 focus:ring-blue-400 placeholder-gray-500" required>
                    <input type="text" id="author" placeholder="اسم المؤلف (اختياري)..." class="w-full p-3 rounded-lg bg-white text-gray-900 border-none focus:ring-2 focus:ring-blue-400 placeholder-gray-500">
                    <select id="lang" class="w-full p-3 rounded-lg bg-white text-gray-900 border-none focus:ring-2 focus:ring-blue-400">
                        <option value="">كل اللغات</option>
                        <option value="ar">اللغة العربية</option>
                        <option value="en">اللغة الإنجليزية</option>
                        <option value="fr">اللغة الفرنسية</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-blue-950 font-bold p-3 rounded-lg transition duration-300 shadow">ابحث في الشبكة العالمية</button>
            </form>
        </div>
    </header>

    <!-- منطقة عرض النتائج (مستوحاة من Zohra-PDF) -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-6">
        <!-- مؤشر التحميل -->
        <div id="loader" class="hidden text-center my-10">
            <div class="animate-spin inline-block w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full"></div>
            <p class="text-gray-500 mt-2">جاري الاتصال بقواعد البيانات العالمية...</p>
        </div>

        <!-- رسالة الخطأ أو عدم وجود نتائج -->
        <div id="statusMessage" class="text-center text-gray-500 my-10 text-lg">أدخل كلمات البحث في الأعلى لتبدأ الاستكشاف.</div>

        <!-- شبكة عرض الكتب -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-900 text-gray-400 text-center p-4 text-sm mt-10">
        متصل شبكياً مع Google Books API و Open Library المفتوحة.
    </footer>

    <!-- نظام تشغيل المحرك وربطه بالشبكات العالمية -->
    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            performGlobalSearch();
        });

        async function performGlobalSearch() {
            const query = document.getElementById('query').value;
            const author = document.getElementById('author').value;
            const lang = document.getElementById('lang').value;
            
            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loader');
            const status = document.getElementById('statusMessage');

            // إعادة ضبط الواجهة
            grid.innerHTML = '';
            status.classList.add('hidden');
            loader.classList.remove('hidden');

            // بناء رابط الاستعلام المتقدم لشبكة Google Books
            let apiURL = `https://googleapis.com{encodeURIComponent(query)}`;
            if (author) apiURL += `+inauthor:${encodeURIComponent(author)}`;
            if (lang) apiURL += `&langRestrict=${lang}`;
            apiURL += `&maxResults=20`; // جلب 20 نتيجة

            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('فشل الاتصال بالشبكة العالمية');
                
                const data = await response.json();
                loader.classList.add('hidden');

                if (!data.items || data.items.length === 0) {
                    status.textContent = 'لم نجد أي كتب تطابق هذا البحث في الشبكات العالمية.';
                    status.classList.remove('hidden');
                    return;
                }

                // عرض النتائج على شكل بطاقات احترافية (Zohra-PDF Style)
                data.items.forEach(item => {
                    const info = item.volumeInfo;
                    const bookId = item.id;
                    const cover = info.imageLinks ? info.imageLinks.thumbnail : 'https://placeholder.com';
                    const title = info.title || 'عنوان غير معروف';
                    const authors = info.authors ? info.authors.join('، ') : 'مؤلف مجهول';
                    const publisher = info.publisher || 'ناشر غير معروف';
                    const year = info.publishedDate ? info.publishedDate.substring(0, 4) : 'تاريخ غير متوفر';
                    
                    // روابط القراءة والتحميل
                    const previewLink = info.previewLink || '#';
                    const infoLink = info.infoLink || '#';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 flex flex-col border border-gray-100";
                    card.innerHTML = `
                        <div class="relative bg-gray-200 h-64 flex items-center justify-center overflow-hidden">
                            <img src="${cover}" alt="${title}" class="object-cover h-full w-full transform hover:scale-105 transition duration-300">
                            <span class="absolute top-2 right-2 bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">${year}</span>
                        </div>
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-900 text-base mb-1 line-clamp-2" title="${title}">${title}</h3>
                                <p class="text-xs text-blue-600 font-semibold mb-2">${authors}</p>
                                <p class="text-xs text-gray-400 mb-3 line-clamp-1">الناشر: ${publisher}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <a href="${previewLink}" target="_blank" class="text-center bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold py-2 px-3 text-xs rounded-lg transition duration-200">📖 قراءة ومعاينة</a>
                                <a href="${infoLink}" target="_blank" class="text-center bg-green-600 text-white hover:bg-green-700 font-bold py-2 px-3 text-xs rounded-lg transition duration-200">📥 تحميل / مصدر</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                loader.classList.add('hidden');
                status.textContent = 'حدث خطأ أثناء الاتصال بالخادم. تحقق من إنترنت الخاص بك.';
                status.classList.remove('hidden');
                console.error(error);
            }
        }
    </script>
</body>
</html>
