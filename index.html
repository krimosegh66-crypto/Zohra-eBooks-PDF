<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحرك العالمي للبحث عن الكتب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
        .book-card { transition: 0.2s; }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .search-header { background: linear-gradient(135deg, #1e3a8a, #4f46e5); }
        .loader-spinner { border: 4px solid rgba(255,255,255,0.2); border-top-color: #fbbf24; border-radius: 50%; width: 2.5rem; height: 2.5rem; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cover-placeholder { background: linear-gradient(145deg, #e2e8f0, #f1f5f9); display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.75rem; padding: 0.5rem; }
        .glass-card { background: rgba(30,41,59,0.6); backdrop-filter: blur(4px); }
        .directory-section { background: #0f172a; border-radius: 2rem; }
        .dir-tab-btn { transition: 0.2s; }
        .dir-tab-btn.active { background: linear-gradient(to right, #059669, #0d9488); color: white; }
        .dir-tab-btn:not(.active) { background: transparent; color: #9ca3af; }
        .dir-tab-btn:not(.active):hover { background: rgba(255,255,255,0.05); color: #f3f4f6; }
    </style>
</head>
<body>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

    <!-- شريط البحث -->
    <header class="search-header rounded-2xl shadow-lg p-6 mb-6 text-white">
        <h1 class="text-2xl md:text-3xl font-bold text-center mb-4 flex items-center justify-center gap-2">
            <i class="fas fa-globe-asia"></i> المحرك العالمي للبحث عن الكتب
        </h1>
        <form id="searchForm" class="space-y-4 bg-white/10 p-4 rounded-xl backdrop-blur-sm">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="query" placeholder="عنوان الكتاب أو الكلمات المفتاحية..." class="w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-yellow-400" required>
                <input type="text" id="author" placeholder="اسم المؤلف (اختياري)..." class="w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-yellow-400">
                <select id="lang" class="w-full p-3 rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-yellow-400">
                    <option value="">كل اللغات</option>
                    <option value="ar">العربية</option>
                    <option value="en">الإنجليزية</option>
                    <option value="fr">الفرنسية</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-blue-950 font-bold p-3 rounded-lg transition flex items-center justify-center gap-2">
                <i class="fas fa-search"></i> ابحث
            </button>
        </form>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- الشريط الجانبي (فلاتر) -->
        <aside class="lg:w-72 w-full bg-white rounded-2xl shadow-md p-5 border">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 pb-3 border-b"> <i class="fas fa-sliders-h text-indigo-600"></i> تصفية متقدمة </h2>
            <div class="space-y-5 mt-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">سنة النشر</label>
                    <div class="flex gap-2">
                        <input type="number" id="yearFrom" placeholder="من" class="w-1/2 px-3 py-1.5 border rounded-lg text-sm">
                        <input type="number" id="yearTo" placeholder="إلى" class="w-1/2 px-3 py-1.5 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">اللغة</label>
                    <select id="sidebarLang" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white">
                        <option value="">جميع اللغات</option>
                        <option value="ar">العربية</option>
                        <option value="en">الإنجليزية</option>
                        <option value="fr">الفرنسية</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">نوع الإتاحة</label>
                    <div class="flex gap-3">
                        <label><input type="checkbox" id="chkPreview" checked> معاينة مجانية</label>
                        <label><input type="checkbox" id="chkFulltext"> نص كامل</label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">التصنيف</label>
                    <select id="categoryFilter" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white">
                        <option value="all">جميع التصنيفات</option>
                        <option value="computers">علوم حاسوب</option>
                        <option value="engineering">هندسة</option>
                        <option value="mathematics">رياضيات</option>
                        <option value="physics">فيزياء</option>
                        <option value="literature">أدب</option>
                        <option value="history">تاريخ</option>
                    </select>
                </div>
                <button id="applyFiltersBtn" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-xl transition">تطبيق الفلاتر</button>
                <button id="resetFiltersBtn" class="w-full text-sm text-gray-500 underline mt-1">إعادة تعيين</button>
            </div>
        </aside>

        <!-- منطقة النتائج -->
        <main class="flex-1">
            <div class="flex flex-wrap justify-between items-center bg-white rounded-xl shadow-sm p-3 border mb-5">
                <span class="text-sm text-gray-600">ترتيب حسب:</span>
                <select id="sortOrder" class="text-sm border rounded-lg px-3 py-1.5 bg-white">
                    <option value="relevance">الأكثر صلة</option>
                    <option value="newest">الأحدث</option>
                </select>
                <span id="resultCount" class="text-sm text-gray-500"><i class="fas fa-table ml-1"></i> 0 نتيجة</span>
            </div>

            <div id="loader" class="hidden text-center my-10">
                <div class="loader-spinner mx-auto"></div>
                <p class="text-gray-500 mt-2">جارٍ البحث...</p>
            </div>

            <div id="statusMessage" class="text-center text-gray-500 my-10 text-lg">🔍 أدخل كلمات البحث في الأعلى.</div>

            <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>

            <div id="pagination" class="flex justify-center items-center gap-2 mt-8 hidden">
                <button id="prevPage" class="px-4 py-2 rounded-lg border bg-white text-gray-600 hover:bg-gray-50"><i class="fas fa-chevron-right"></i></button>
                <span id="pageInfo" class="text-sm text-gray-600"></span>
                <button id="nextPage" class="px-4 py-2 rounded-lg border bg-white text-gray-600 hover:bg-gray-50"><i class="fas fa-chevron-left"></i></button>
            </div>
        </main>
    </div>

    <!-- الدليل التعليمي -->
    <div class="directory-section max-w-6xl mx-auto px-4 py-8 my-8 space-y-6 shadow-2xl">
        <div class="flex items-center gap-2 border-b border-gray-700 pb-4">
            <i class="fa-solid fa-graduation-cap text-emerald-400 text-xl"></i>
            <h2 class="text-xl font-bold text-white">الدليل التعليمي والمكتبات البحثية</h2>
        </div>
        <div class="grid grid-cols-3 gap-3 max-w-2xl mx-auto p-1.5 rounded-2xl bg-gray-800/30 border border-gray-700/50">
            <button onclick="switchDirectory('schools')" id="btn-schools" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white active">المدارس</button>
            <button onclick="switchDirectory('universities')" id="btn-universities" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400">الجامعات</button>
            <button onclick="switchDirectory('libraries')" id="btn-libraries" class="dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400">المكتبات</button>
        </div>
        <div id="directoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pt-4"></div>
    </div>

    <footer class="mt-12 text-center text-sm text-gray-400 border-t pt-6">© 2026 المحرك العالمي للكتب</footer>
</div>

<script>
    (function() {
        // ===== عناصر البحث =====
        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('query');
        const authorInput = document.getElementById('author');
        const langSelect = document.getElementById('lang');
        const sidebarLang = document.getElementById('sidebarLang');
        const yearFrom = document.getElementById('yearFrom');
        const yearTo = document.getElementById('yearTo');
        const categoryFilter = document.getElementById('categoryFilter');
        const applyBtn = document.getElementById('applyFiltersBtn');
        const resetBtn = document.getElementById('resetFiltersBtn');
        const sortOrder = document.getElementById('sortOrder');
        const grid = document.getElementById('resultsGrid');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMessage');
        const resultCount = document.getElementById('resultCount');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');

        let currentPage = 0;
        let totalItems = 0;
        let currentQuery = '';

        // مزامنة اللغة
        langSelect.addEventListener('change', () => sidebarLang.value = langSelect.value);
        sidebarLang.addEventListener('change', () => langSelect.value = sidebarLang.value);

        // ===== دالة البحث الأساسية =====
        async function performSearch(page = 0) {
            const query = queryInput.value.trim();
            const author = authorInput.value.trim();

            if (!query && !author) {
                statusMsg.textContent = '⚠️ الرجاء إدخال عنوان الكتاب أو المؤلف.';
                statusMsg.classList.remove('hidden');
                grid.innerHTML = '';
                resultCount.innerHTML = '<i class="fas fa-table ml-1"></i> 0 نتيجة';
                pagination.classList.add('hidden');
                return;
            }

            loader.classList.remove('hidden');
            statusMsg.classList.add('hidden');
            grid.innerHTML = '';
            pagination.classList.add('hidden');

            const startIndex = page * 12;
            const lang = langSelect.value;
            const from = parseInt(yearFrom.value) || 0;
            const to = parseInt(yearTo.value) || 0;
            const cat = categoryFilter.value;

            // بناء استعلام Google Books
            let q = query;
            if (author) q += `+inauthor:"${encodeURIComponent(author)}"`;
            if (from > 0) q += `+publishedYear:${from}`;
            if (to > 0 && to >= from) q += `-${to}`;
            if (cat !== 'all') q += `+subject:${encodeURIComponent(cat)}`;

            let apiUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}`;
            if (lang) apiUrl += `&langRestrict=${lang}`;
            apiUrl += `&startIndex=${startIndex}&maxResults=12`;
            apiUrl += (sortOrder.value === 'newest') ? '&orderBy=newest' : '&orderBy=relevance';
            // يمكنك إضافة مفتاحك هنا:
            // apiUrl += '&key=YOUR_API_KEY';

            try {
                let response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                let data = await response.json();

                // إذا لم توجد نتائج من Google Books، جرب Open Library كبديل
                if (!data.items || data.items.length === 0) {
                    // استخدام Open Library API
                    const olUrl = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&author=${encodeURIComponent(author)}&limit=12&page=${page+1}`;
                    const olResponse = await fetch(olUrl);
                    if (!olResponse.ok) throw new Error(`Open Library HTTP ${olResponse.status}`);
                    const olData = await olResponse.json();
                    if (olData.docs && olData.docs.length > 0) {
                        // تحويل بيانات Open Library إلى صيغة مشابهة لـ Google Books
                        const items = olData.docs.map(doc => ({
                            volumeInfo: {
                                title: doc.title || 'عنوان غير معروف',
                                authors: doc.author_name || ['مؤلف مجهول'],
                                publisher: doc.publisher ? doc.publisher[0] : 'ناشر غير معروف',
                                publishedDate: doc.first_publish_year ? String(doc.first_publish_year) : null,
                                imageLinks: { thumbnail: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : null },
                                previewLink: `https://openlibrary.org${doc.key}`,
                                infoLink: `https://openlibrary.org${doc.key}`
                            }
                        }));
                        totalItems = olData.numFound || items.length;
                        renderBooks(items);
                        resultCount.innerHTML = `<i class="fas fa-table ml-1"></i> ${totalItems} نتيجة (من Open Library)`;
                        updatePagination(page);
                        loader.classList.add('hidden');
                        return;
                    } else {
                        statusMsg.textContent = '😕 لا توجد نتائج في Google Books ولا في Open Library.';
                        statusMsg.classList.remove('hidden');
                        resultCount.innerHTML = '<i class="fas fa-table ml-1"></i> 0 نتيجة';
                        loader.classList.add('hidden');
                        return;
                    }
                }

                // معالجة نتائج Google Books
                totalItems = data.totalItems || data.items.length;
                if (totalItems > 120) totalItems = 120;
                renderBooks(data.items);
                resultCount.innerHTML = `<i class="fas fa-table ml-1"></i> ${totalItems} نتيجة (من Google Books)`;
                updatePagination(page);
                loader.classList.add('hidden');

            } catch (error) {
                loader.classList.add('hidden');
                statusMsg.textContent = '⚠️ فشل الاتصال بالخوادم. تأكد من اتصالك بالإنترنت، أو حاول لاحقاً.';
                statusMsg.classList.remove('hidden');
                console.error('Search error:', error);
            }
        }

        // ===== عرض البطاقات =====
        function renderBooks(items) {
            grid.innerHTML = '';
            items.forEach(item => {
                const info = item.volumeInfo || {};
                let cover = 'https://picsum.photos/seed/' + (item.id || Math.random()) + '/200/280';
                if (info.imageLinks && info.imageLinks.thumbnail) {
                    cover = info.imageLinks.thumbnail.replace('http:', 'https:');
                }
                const title = info.title || 'عنوان غير معروف';
                const authors = info.authors ? info.authors.join('، ') : 'مؤلف مجهول';
                const publisher = info.publisher || 'ناشر غير معروف';
                const year = info.publishedDate ? info.publishedDate.substring(0, 4) : 'سنة غير متوفرة';
                const previewLink = info.previewLink || '#';
                const infoLink = info.infoLink || '#';

                const card = document.createElement('div');
                card.className = "book-card bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col h-full";
                card.innerHTML = `
                    <div class="h-48 bg-gray-100 overflow-hidden relative">
                        <img src="${cover}" alt="${title}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'cover-placeholder w-full h-full flex flex-col items-center justify-center text-gray-400\\'><i class=\\'fas fa-book text-4xl\\'></i><span class=\\'mt-1 text-xs\\'>لا توجد صورة</span></div>'">
                        <span class="absolute top-2 left-2 bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">${year}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold text-gray-800 line-clamp-2">${title}</h3>
                        <p class="text-sm text-indigo-600 font-medium mt-1"><i class="fas fa-user-pen text-xs"></i> ${authors}</p>
                        <p class="text-xs text-gray-400 mt-1">الناشر: ${publisher}</p>
                        <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t">
                            <a href="${previewLink}" target="_blank" class="text-center bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold py-2 px-3 text-xs rounded-lg">📖 قراءة</a>
                            <a href="${infoLink}" target="_blank" class="text-center bg-green-600 text-white hover:bg-green-700 font-bold py-2 px-3 text-xs rounded-lg">📥 تحميل</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ===== الترقيم =====
        function updatePagination(page) {
            const totalPages = Math.ceil(totalItems / 12);
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                pageInfo.textContent = `الصفحة ${page + 1} من ${totalPages}`;
                prevBtn.disabled = (page === 0);
                nextBtn.disabled = (page >= totalPages - 1);
            } else {
                pagination.classList.add('hidden');
            }
            currentPage = page;
        }

        // ===== أحداث النماذج =====
        form.addEventListener('submit', (e) => { e.preventDefault(); currentPage = 0; performSearch(0); });
        applyBtn.addEventListener('click', (e) => { e.preventDefault(); currentPage = 0; performSearch(0); });
        resetBtn.addEventListener('click', () => {
            queryInput.value = ''; authorInput.value = ''; langSelect.value = ''; sidebarLang.value = '';
            yearFrom.value = ''; yearTo.value = ''; categoryFilter.value = 'all'; sortOrder.value = 'relevance';
            grid.innerHTML = ''; statusMsg.textContent = '🔍 أدخل كلمات البحث في الأعلى.';
            statusMsg.classList.remove('hidden'); resultCount.innerHTML = '<i class="fas fa-table ml-1"></i> 0 نتيجة';
            pagination.classList.add('hidden'); currentPage = 0; totalItems = 0;
        });
        prevBtn.addEventListener('click', () => { if (currentPage > 0) performSearch(currentPage - 1); });
        nextBtn.addEventListener('click', () => { const totalPages = Math.ceil(totalItems / 12); if (currentPage < totalPages - 1) performSearch(currentPage + 1); });
        sortOrder.addEventListener('change', () => { if (queryInput.value.trim() || authorInput.value.trim()) { currentPage = 0; performSearch(0); } });

        // ===== الدليل التعليمي (بيانات ثابتة) =====
        const directoryData = {
            schools: [
                { name: "مدرسة زهرة الأهلية", type: "تعليم أساسي وثانوي", address: "الرياض، حي الياسمين", phone: "+966112345678", email: "info@zohra.edu.sa", mapUrl: "https://google.com" },
                { name: "ثانوية المتفوقين الرقمية", type: "ثانوي - مسار تقني", address: "جدة، حي الخالدية", phone: "+966129876543", email: "contact@smart.edu", mapUrl: "https://google.com" }
            ],
            universities: [
                { name: "جامعة الملك سعود العالمية", type: "حكومية بحثية", address: "الرياض، الدرعية", phone: "+966114670000", email: "admissions@ksu.edu.sa", mapUrl: "https://google.com" },
                { name: "جامعة العلوم والتكنولوجيا", type: "أهلية - ذكاء اصطناعي", address: "الدمام، حي الفنار", phone: "+966135558899", email: "research@ustd.edu.sa", mapUrl: "https://google.com" }
            ],
            libraries: [
                { name: "مكتبة الملك فهد الوطنية", type: "وطنية - أطروحات", address: "الرياض، حي العليا", phone: "+966114186111", email: "services@kfnl.gov.sa", mapUrl: "https://google.com" },
                { name: "مكتبة الإسكندرية الرقمية", type: "مكتبة بحثية عالمية", address: "الإسكندرية، الشاطبي", phone: "+2034839999", email: "library@bibalex.org", mapUrl: "https://google.com" }
            ]
        };

        function renderDirectory(cat) {
            const gridDir = document.getElementById('directoryGrid');
            const items = directoryData[cat] || [];
            gridDir.innerHTML = '';
            if (items.length === 0) { gridDir.innerHTML = '<p class="col-span-full text-center text-gray-500 py-6">لا توجد بيانات.</p>'; return; }
            items.forEach(item => {
                gridDir.innerHTML += `
                    <div class="glass-card rounded-2xl p-5 border border-gray-700/50 hover:border-emerald-500/40 transition flex flex-col justify-between group">
                        <div class="space-y-4">
                            <span class="text-[10px] uppercase font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">${item.type}</span>
                            <h3 class="font-bold text-white text-base group-hover:text-emerald-400 transition">${item.name}</h3>
                            <div class="space-y-2.5 text-xs text-gray-400 border-t border-gray-800 pt-3">
                                <div><i class="fa-solid fa-location-dot text-rose-400 ml-1"></i> ${item.address}</div>
                                <div><i class="fa-solid fa-phone text-sky-400 ml-1"></i> <a href="tel:${item.phone}" class="hover:text-white">${item.phone}</a></div>
                                <div><i class="fa-solid fa-envelope text-amber-400 ml-1"></i> <a href="mailto:${item.email}" class="hover:text-white">${item.email}</a></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-5 pt-3 border-t border-gray-800">
                            <a href="tel:${item.phone}" class="flex items-center justify-center gap-1 bg-gray-800 hover:bg-gray-700 text-gray-200 py-2.5 rounded-xl text-xs font-bold border border-gray-700 transition">📞 اتصال</a>
                            <a href="${item.mapUrl}" target="_blank" class="flex items-center justify-center gap-1 bg-gradient-to-r from-gray-700 to-gray-800 hover:from-emerald-600 hover:to-teal-600 text-white py-2.5 rounded-xl text-xs font-bold border border-gray-600/50 transition">🗺️ خريطة</a>
                        </div>
                    </div>
                `;
            });
        }

        window.switchDirectory = function(cat) {
            document.querySelectorAll('.dir-tab-btn').forEach(btn => {
                btn.className = "dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-gray-400 hover:bg-gray-800 hover:text-white transition";
            });
            const active = document.getElementById(`btn-${cat}`);
            if (active) active.className = "dir-tab-btn py-3 px-4 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-600/10 transition";
            renderDirectory(cat);
        };
        renderDirectory('schools');

        // تشغيل بحث تجريبي فور التحميل لاختبار الاتصال (اختياري)
        // performSearch(0);
    })();
</script>
</body>
</html>
